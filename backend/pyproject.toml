[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "quant-terminal"
version = "0.1.0"
description = "Multi-market quantitative research terminal with controlled trading tests"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "polars>=0.20.0",
    "duckdb>=0.9.0",
    "numpy>=1.24.0",
    "loguru>=0.7.0",
    "pytdx>=1.72",
    "websockets>=12.0",
    "python-multipart>=0.0.6",
    "httpx>=0.26.0",
    "requests>=2.31.0",
    "scipy>=1.11.0",
    "reportlab>=4.0.0",
    "torch==2.12.0+cu132",
    "ccxt>=4.5.54",
    "python-okx>=0.4.1",
    "getdaft>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[tool.uv]
default-groups = ["dev"]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/test/cu132"
explicit = true

[tool.poetry]
name = "quant-terminal"
version = "0.1.0"
description = "Multi-market quantitative research terminal with controlled trading tests"
authors = ["Quant Terminal Team <team@quantterminal.com>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/yourusername/quant-terminal"
repository = "https://github.com/yourusername/quant-terminal"
keywords = ["quant", "trading", "backtest", "gpu", "cuda"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
packages = [{ include = "quant_terminal", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
polars = "^0.20.0"
numpy = "^1.24.0"
pandas = "^2.0.0"
pyyaml = "^6.0"
loguru = "^0.7.0"
pydantic = "^2.0.0"
click = "^8.0.0"
requests = "^2.31.0"
scipy = "^1.11.0"
fastapi = { version = "^0.104.0", optional = true }
uvicorn = { version = "^0.24.0", optional = true }
torch = { version = "^2.0.0", optional = true }
scikit-learn = { version = "^1.3.0", optional = true }
akshare = { version = "^1.11.0", optional = true }

[tool.poetry.extras]
api = ["fastapi", "uvicorn"]
gpu = ["torch"]
ml = ["scikit-learn"]
data = ["akshare"]
all = ["fastapi", "uvicorn", "torch", "scikit-learn", "akshare"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-cov = "^4.0.0"
pytest-asyncio = "^0.21.0"
black = "^23.0.0"
ruff = "^0.1.0"
mypy = "^1.0.0"
pre-commit = "^3.0.0"
bandit = "^1.7.0"
safety = "^2.3.0"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = "\\.pyi?$"
exclude = '''
/(
    \\.eggs
  | \\.git
  | \\.hg
  | \\.mypy_cache
  | \\.tox
  | \\.venv
  | _build
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = ["E501"]  # Line too long (handled by black)

[tool.ruff.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true
# Phase 3: 增量缓存优化
incremental = true
cache_dir = ".mypy_cache"
sqlite_cache = true
cache_fine_grained = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --ignore=tests/ai_lab"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU",
    "integration: marks tests that require external services",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
fail_under = 80

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B601"]
