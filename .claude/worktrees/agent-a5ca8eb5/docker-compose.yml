version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production-cpu
    image: quant-terminal:cpu
    container_name: quant-terminal-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - quant-network

  backend-gpu:
    build:
      context: .
      dockerfile: Dockerfile
      target: production-gpu
      args:
        GPU_SUPPORT: "true"
    image: quant-terminal:gpu
    container_name: quant-terminal-backend-gpu
    ports:
      - "8001:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles:
      - gpu
    networks:
      - quant-network

  redis:
    image: redis:7-alpine
    container_name: quant-terminal-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - quant-network

  # 开发环境
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: quant-terminal:dev
    container_name: quant-terminal-dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./tests:/app/tests
      - ./data:/app/data
      - ./.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=DEBUG
      - PYTHONDONTWRITEBYTECODE=1
    command: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
    profiles:
      - dev
    networks:
      - quant-network

volumes:
  redis-data:

networks:
  quant-network:
    driver: bridge
